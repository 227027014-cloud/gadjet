<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Zone | Payment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <h2 class="logo">GADGET<span>ZONE</span></h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </div>
    </nav>

    <!-- HEADING -->
    <section class="payment-heading">
        <h1>Payment</h1>
        <p>Choose your preferred payment method</p>
    </section>

    <!-- PAYMENT SECTION -->
    <section class="payment-section">

        <div class="payment-container">

            <div class="payment-box">

                <h2>Select Payment Method</h2>

                <form id="paymentForm" onsubmit="makePayment(event)">

                    <label class="payment-option">
                        <input type="radio" name="payment" value="UPI" required>
                        <div>
                            <h3>UPI Payment</h3>
                            <p>Google Pay / PhonePe / Paytm</p>
                        </div>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment" value="Card">
                        <div>
                            <h3>Debit / Credit Card</h3>
                            <p>Visa / Mastercard / RuPay</p>
                        </div>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment" value="COD">
                        <div>
                            <h3>Cash on Delivery</h3>
                            <p>Pay when your product arrives</p>
                        </div>
                    </label>

                    <button type="submit" class="payment-button">
                        Confirm Order →
                    </button>

                </form>

            </div>

            <!-- ORDER DETAILS -->
            <div class="payment-summary">

                <h2>Order Summary</h2>

                <div id="paymentItems"></div>

                <hr>

                <div class="payment-total">
                    <span>Total Amount</span>
                    <strong id="paymentTotal">₹0</strong>
                </div>

                <p class="secure-text">🔒 Demo checkout – no real payment is collected.</p>

            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <h2>GADGET ZONE</h2>
        <p>© 2026 Gadget Zone. All Rights Reserved.</p>
    </footer>


    <script>

        let order = JSON.parse(localStorage.getItem("currentOrder"));

        function displayPayment() {

            if (!order) {
                alert("No order found!");
                window.location.href = "products.html";
                return;
            }

            let container = document.getElementById("paymentItems");

            order.products.forEach(item => {

                container.innerHTML += `
                    <div class="payment-item">
                        <span>${item.name} × ${item.quantity}</span>
                        <strong>₹${(item.price * item.quantity).toLocaleString("en-IN")}</strong>
                    </div>
                `;

            });

            document.getElementById("paymentTotal").innerText =
                "₹" + order.total.toLocaleString("en-IN");

        }

        function makePayment(event) {

            event.preventDefault();

            let selectedPayment =
                document.querySelector('input[name="payment"]:checked');

            if (!selectedPayment) {
                alert("Please select a payment method!");
                return;
            }

            order.paymentMethod = selectedPayment.value;
            order.orderDate = new Date().toLocaleString();

           localStorage.setItem("completedOrder", JSON.stringify(order));

let history = JSON.parse(localStorage.getItem("orderHistory")) || [];

history.push(order);

localStorage.setItem("orderHistory", JSON.stringify(history));

            window.location.href = "bill.html";

        }

        displayPayment();

    </script>

</body>
</html>
