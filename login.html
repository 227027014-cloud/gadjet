<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Zone | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <h2 class="logo">GADGET<span>ZONE</span></h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </div>
    </nav>

    <!-- LOGIN SECTION -->
    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-icon">🔐</div>

            <h1>Welcome Back!</h1>
            <p class="auth-subtitle">Login to your Gadget Zone account</p>

            <form onsubmit="loginAccount(event)">

                <label>Email Address</label>

                <input type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required>

                <label>Password</label>

                <input type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required>

                <div class="auth-options">

                    <label class="remember-label">
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#" onclick="forgotPassword(event)">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <h2>GADGET ZONE</h2>
        <p>© 2026 Gadget Zone. All Rights Reserved.</p>
    </footer>


    <script>

        function loginAccount(event) {

            event.preventDefault();

            let email = document.getElementById("loginEmail").value;
            let password = document.getElementById("loginPassword").value;

            let users = JSON.parse(localStorage.getItem("users")) || [];

            let user = users.find(function(item) {
                return item.email === email &&
                       item.password === password;
            });

            if (user) {

                localStorage.setItem("loggedInUser", JSON.stringify(user));

                alert("Login Successful! Welcome to Gadget Zone.");

                window.location.href = "index.html";

            } else {

                alert("Invalid Email or Password! Please Register First.");

            }

        }

        function forgotPassword(event) {

            event.preventDefault();

            alert("Please contact our support team to reset your password.");

        }

    </script>

</body>
</html>
