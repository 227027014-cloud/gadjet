<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Zone | My Orders</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <h2 class="logo">GADGET<span>ZONE</span></h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <!-- HEADING -->
    <section class="orders-heading">
        <h1>My Orders</h1>
        <p>Track and manage your purchases</p>
    </section>

    <!-- ORDERS SECTION -->
    <section class="orders-section">

        <div class="orders-container">

            <div class="orders-top">
                <h2>Order History</h2>
                <span id="orderCount">0 Orders</span>
            </div>

            <div id="ordersList"></div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <h2>GADGET ZONE</h2>
        <p>© 2026 Gadget Zone. All Rights Reserved.</p>
    </footer>


    <script>

        let orders = JSON.parse(localStorage.getItem("orderHistory")) || [];

        function displayOrders() {

            let container = document.getElementById("ordersList");

            document.getElementById("orderCount").innerText =
                orders.length + (orders.length === 1 ? " Order" : " Orders");

            if (orders.length === 0) {

                container.innerHTML = `
                    <div class="no-orders">
                        <div>📦</div>
                        <h2>No Orders Yet!</h2>
                        <p>Your purchased products will appear here.</p>
                        <button onclick="window.location.href='products.html'">
                            Start Shopping
                        </button>
                    </div>
                `;

                return;

            }

            orders.forEach((order, index) => {

                let productsHTML = "";

                order.products.forEach(item => {

                    productsHTML += `
                        <div class="order-product">
                            <span>${item.name} × ${item.quantity}</span>
                            <strong>₹${(item.price * item.quantity).toLocaleString("en-IN")}</strong>
                        </div>
                    `;

                });

                container.innerHTML += `

                    <div class="order-card">

                        <div class="order-card-header">
                            <div>
                                <h3>Order #${index + 1}</h3>
                                <p>${order.orderDate || "Date unavailable"}</p>
                            </div>

                            <span class="order-status">Confirmed</span>
                        </div>

                        <div class="order-products">
                            ${productsHTML}
                        </div>

                        <div class="order-card-footer">

                            <span>Payment: ${order.paymentMethod}</span>

                            <strong>
                                Total: ₹${order.total.toLocaleString("en-IN")}
                            </strong>

                        </div>

                    </div>

                `;

            });

        }

        displayOrders();

    </script>

</body>
</html>
