<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gadget Zone | My Wishlist</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">⚡ GADGET ZONE</div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>

    </nav>

    <!-- WISHLIST HEADING -->
    <section class="wishlist-heading">

        <h1>My <span>Wishlist</span></h1>

        <p>Your favourite gadgets are waiting for you!</p>

    </section>

    <!-- WISHLIST PRODUCTS -->
    <section class="wishlist-section">

        <div class="wishlist-grid" id="wishlistContainer">

        </div>

    </section>

    <!-- FOOTER -->
    <footer>

        <p>© 2026 Gadget Zone. All Rights Reserved.</p>

    </footer>

    <script src="script.js"></script>

    <script>

        let wishlistItems = JSON.parse(localStorage.getItem("wishlist")) || [];

        const wishlistContainer = document.getElementById("wishlistContainer");

        function displayWishlist() {

            wishlistItems = JSON.parse(localStorage.getItem("wishlist")) || [];

            wishlistContainer.innerHTML = "";

            if (wishlistItems.length === 0) {

                wishlistContainer.innerHTML = `
                    <div class="empty-wishlist">
                        <h2>Your Wishlist is Empty!</h2>
                        <p>Add your favourite gadgets to your wishlist.</p>
                        <a href="products.html" class="continue-shopping">
                            Explore Products
                        </a>
                    </div>
                `;

                return;
            }

            wishlistItems.forEach((product, index) => {

                wishlistContainer.innerHTML += `

                    <div class="wishlist-product">

                        <img src="${product.image || ''}" alt="${product.name}">

                        <h3>${product.name}</h3>

                        <p>₹${product.price.toLocaleString("en-IN")}</p>

                        <button onclick="moveToCart(${index})">
                            Add to Cart
                        </button>

                        <button onclick="removeWishlist(${index})">
                            Remove
                        </button>

                    </div>

                `;

            });

        }

        function moveToCart(index) {

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            let product = wishlistItems[index];

            let existing = cart.find(item => item.id === product.id);

            if (existing) {

                existing.quantity++;

            } else {

                cart.push({
                    ...product,
                    quantity: 1
                });

            }

            localStorage.setItem("cart", JSON.stringify(cart));

            alert("Product added to Cart successfully!");

        }

        function removeWishlist(index) {

            wishlistItems.splice(index, 1);

            localStorage.setItem("wishlist", JSON.stringify(wishlistItems));

            displayWishlist();

            alert("Product removed from Wishlist!");

        }

        displayWishlist();

    </script>

</body>

</html>
