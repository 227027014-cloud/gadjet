<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Zone | Invoice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <h2 class="logo">GADGET<span>ZONE</span></h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
        </div>
    </nav>

    <!-- BILL SECTION -->
    <section class="bill-section">

        <div class="bill-container">

            <div class="bill-header">
                <h1>GADGET<span>ZONE</span></h1>
                <h2>ORDER INVOICE</h2>
                <p>Thank you for shopping with us!</p>
            </div>

            <hr>

            <div class="bill-details">

                <div>
                    <h3>Customer Details</h3>
                    <p id="billName"></p>
                    <p id="billEmail"></p>
                    <p id="billPhone"></p>
                    <p id="billAddress"></p>
                </div>

                <div>
                    <h3>Order Information</h3>
                    <p id="billDate"></p>
                    <p id="billPayment"></p>
                    <p id="billNumber"></p>
                </div>

            </div>

            <h3 class="bill-products-heading">Purchased Products</h3>

            <div class="bill-table-wrapper">

                <table class="bill-table">

                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody id="billProducts"></tbody>

                </table>

            </div>

            <div class="bill-total">

                <div>
                    <span>Grand Total</span>
                    <strong id="billTotal"></strong>
                </div>

            </div>

            <div class="bill-footer">
                <h2>Thank You!</h2>
                <p>Your order has been successfully placed.</p>
                <p>Gadget Zone – Your Technology Partner</p>
            </div>

            <div class="bill-buttons">
                <button onclick="window.print()">Download / Print Bill</button>
                <button onclick="finishOrder()">Continue Shopping</button>
            </div>

        </div>

    </section>

    <script>

        let order = JSON.parse(localStorage.getItem("completedOrder"));

        function displayBill() {

            if (!order) {
                alert("No order details found!");
                window.location.href = "index.html";
                return;
            }

            let customer = order.customer;

            document.getElementById("billName").innerText =
                "Name: " + customer.name;

            document.getElementById("billEmail").innerText =
                "Email: " + customer.email;

            document.getElementById("billPhone").innerText =
                "Phone: " + customer.phone;

            document.getElementById("billAddress").innerText =
                "Address: " + customer.address + ", " +
                customer.city + " - " + customer.pincode;

            document.getElementById("billDate").innerText =
                "Date: " + order.orderDate;

            document.getElementById("billPayment").innerText =
                "Payment: " + order.paymentMethod;

            let orderNumber = "GZ" + Date.now();

            document.getElementById("billNumber").innerText =
                "Order ID: " + orderNumber;

            let products = document.getElementById("billProducts");

            order.products.forEach(item => {

                let total = item.price * item.quantity;

                products.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>₹${item.price.toLocaleString("en-IN")}</td>
                        <td>${item.quantity}</td>
                        <td>₹${total.toLocaleString("en-IN")}</td>
                    </tr>
                `;

            });

            document.getElementById("billTotal").innerText =
                "₹" + order.total.toLocaleString("en-IN");

        }

        function finishOrder() {

            localStorage.removeItem("cart");
            localStorage.removeItem("currentOrder");
            localStorage.removeItem("completedOrder");

            window.location.href = "success.html";

        }

        displayBill();

    </script>

</body>
</html>
